<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MoneyPrinterV2{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --sidebar-width: 220px;
      --accent: #7c3aed;
    }
    body { min-height: 100vh; }
    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-width);
      min-height: 100vh;
      background: #111;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    #sidebar .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      padding: 1.25rem 1rem;
      border-bottom: 1px solid #222;
      letter-spacing: .5px;
    }
    #sidebar .brand span { color: var(--accent); }
    #sidebar .nav-link {
      color: #aaa;
      border-radius: 6px;
      margin: 2px 8px;
      padding: 8px 12px;
      font-size: .9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #sidebar .nav-link:hover, #sidebar .nav-link.active {
      color: #fff;
      background: #1e1e2e;
    }
    #sidebar .nav-link.active { color: var(--accent); }
    #sidebar .nav-link i { font-size: 1.05rem; width: 20px; text-align: center; }
    /* ── Main content ── */
    #main {
      flex: 1;
      overflow-y: auto;
      background: #0f0f17;
    }
    .page-header {
      padding: 1.5rem 1.75rem 0;
      margin-bottom: 1.5rem;
    }
    .page-header h1 { font-size: 1.5rem; font-weight: 700; }
    .page-header p  { color: #888; font-size: .9rem; }
    .content-area { padding: 0 1.75rem 2rem; }
    /* ── Cards ── */
    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a40;
    }
    .card-title { font-size: .95rem; font-weight: 600; }
    /* ── Stat cards ── */
    .stat-card { border-radius: 12px; }
    .stat-card .stat-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    /* ── Task toast ── */
    #task-toast-container {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999;
      display: flex; flex-direction: column; gap: .5rem;
    }
    .task-toast {
      background: #1e1e2e; border: 1px solid #3a3a55;
      border-radius: 10px; padding: .85rem 1.1rem;
      min-width: 280px; max-width: 340px;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
      animation: slideIn .2s ease;
    }
    @keyframes slideIn { from { opacity:0; transform:translateY(12px); } }
    .task-toast.done  { border-color: #16a34a; }
    .task-toast.error { border-color: #dc2626; }
    /* ── Misc ── */
    .badge-running { background: #1d4ed8; }
    .table > thead > tr > th { color: #888; font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; }
    .btn-accent { background: var(--accent); border: none; color: #fff; }
    .btn-accent:hover { background: #6d28d9; color: #fff; }
  </style>
</head>
<body class="d-flex">

<!-- ── Sidebar ──────────────────────────────────────────────── -->
<nav id="sidebar">
  <div class="brand">Money<span>Printer</span>&nbsp;V2</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li class="nav-item">
      <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if '/youtube' in request.path %}active{% endif %}" href="/youtube">
        <i class="bi bi-youtube"></i> YouTube Shorts
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if '/twitter' in request.path %}active{% endif %}" href="/twitter">
        <i class="bi bi-twitter-x"></i> Twitter Bot
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if '/afm' in request.path %}active{% endif %}" href="/afm">
        <i class="bi bi-bag-check"></i> Affiliate Marketing
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if '/outreach' in request.path %}active{% endif %}" href="/outreach">
        <i class="bi bi-envelope-paper"></i> Outreach
      </a>
    </li>
    <li class="nav-item mt-auto mb-2">
      <a class="nav-link {% if '/config' in request.path %}active{% endif %}" href="/config">
        <i class="bi bi-gear"></i> Config
      </a>
    </li>
  </ul>
</nav>

<!-- ── Main ─────────────────────────────────────────────────── -->
<div id="main">
  {% block content %}{% endblock %}
</div>

<!-- ── Task notification area ──────────────────────────────── -->
<div id="task-toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ── Global task polling ── */
const _polls = {};

function startTaskPoll(taskId, label, onDone) {
  const container = document.getElementById('task-toast-container');
  const el = document.createElement('div');
  el.className = 'task-toast';
  el.innerHTML = `
    <div class="d-flex align-items-center gap-2">
      <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
      <div>
        <div style="font-size:.85rem;font-weight:600">${label}</div>
        <div class="text-muted" style="font-size:.78rem">Running…</div>
      </div>
    </div>`;
  container.appendChild(el);

  const interval = setInterval(async () => {
    const r = await fetch(`/api/task/${taskId}`);
    const data = await r.json();
    if (data.status === 'done' || data.status === 'error') {
      clearInterval(interval);
      const ok = data.status === 'done';
      el.className = `task-toast ${ok ? 'done' : 'error'}`;
      el.innerHTML = `
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-${ok ? 'check-circle-fill text-success' : 'x-circle-fill text-danger'}" style="font-size:1.2rem"></i>
          <div>
            <div style="font-size:.85rem;font-weight:600">${label}</div>
            <div class="text-muted" style="font-size:.78rem">${data.message}</div>
          </div>
          <button type="button" class="btn-close btn-close-white ms-auto" style="font-size:.7rem"></button>
        </div>`;
      el.querySelector('.btn-close').onclick = () => el.remove();
      if (onDone) onDone(ok, data.message);
      setTimeout(() => el.remove(), 8000);
    }
  }, 2500);
}

async function apiPost(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  return r.json();
}

async function apiDelete(url) {
  return fetch(url, { method: 'DELETE' }).then(r => r.json());
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
